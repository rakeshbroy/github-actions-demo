name: PR Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with: 
          distribution: temurin
          java-version: '26'

      - name: Run Unit Tests
        run: |
          chmod +x mvnw
          ./mvnw test